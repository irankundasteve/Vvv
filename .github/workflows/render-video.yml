name: Render Promo Video
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm rebuild @tailwindcss/oxide

      - name: Render Video
        run: npm run render

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-typo-video
          path: video.mp4
